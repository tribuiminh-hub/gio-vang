name: Build Giờ Vàng

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kiểm thử logic tính giờ
        run: node tests/policy.test.mjs

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GioVang.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GioVang-apk
          path: GioVang.apk

      - name: Phát hành bản mới nhất (link tải cố định)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Giờ Vàng (bản mới nhất)
          body: |
            Tải GioVang.apk về máy của con và cài đặt.
            Bản build số ${{ github.run_number }}.
          files: GioVang.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
